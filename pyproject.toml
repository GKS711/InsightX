[project]
name = "insightx"
version = "6.0.0a1"
description = "AI-powered customer feedback and YouTube comment insight tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "python-dotenv>=1.0.0",
    "beautifulsoup4>=4.12.3",
    "jinja2>=3.1.3",
    "google-genai>=1.59.0",
    "requests>=2.31.0",
    "certifi>=2024.0",
    "youtube-comment-downloader>=0.1.76",
    # v6: sync persistence + Turso/libsql
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "sqlalchemy-libsql>=0.2.0",      # Turso dialect (sync only as of 2026-05)
    "libsql-experimental>=0.0.55",
    "redis>=5.0",
    "rq>=1.15",
    "reportlab>=4.0",
    "python-docx>=1.1",
    "greenlet>=3.5.0",
]

[tool.pyright]
venvPath = "."
venv = ".venv"

