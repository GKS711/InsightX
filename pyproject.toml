[project]
name = "insightx"
version = "5.0.0b1"
description = "AI-powered customer feedback and YouTube comment insight tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "python-dotenv>=1.0.0",
    "beautifulsoup4>=4.12.3",
    "jinja2>=3.1.3",
    "google-genai>=1.59.0",
    "requests>=2.31.0",
    "youtube-comment-downloader>=0.1.76",
    # v5: persistence + jobs + reports
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "aiosqlite>=0.19",
    "asyncpg>=0.29",
    "redis>=5.0",
    "rq>=1.15",
    "reportlab>=4.0",
    "python-docx>=1.1",
]

[tool.pyright]
venvPath = "."
venv = ".venv"

